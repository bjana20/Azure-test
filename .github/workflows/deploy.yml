name: Deploy Server to AKS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: bhaskararitraacr
  RESOURCE_GROUP: rg-node-cicd
  AKS_CLUSTER: my-aks-cluster
  SERVER_IMAGE: server

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4


      # 2. Check project structure
      - name: Check directory structure
        run: |
          echo "Current directory:"
          pwd

          echo "Project files:"
          ls -la

          echo "Checking server directory..."
          test -d ./server && echo "✅ Server directory exists" || (echo "❌ Server directory NOT found" && exit 1)

          echo "Checking k8s directory..."
          test -d ./k8s && echo "✅ k8s directory exists" || (echo "❌ k8s directory NOT found" && exit 1)


      # 3. Login to Azure using OIDC
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


      # 4. Login to Azure Container Registry
      - name: Login to ACR
        run: |
          echo "Logging into ACR..."
          az acr login --name ${{ env.ACR_NAME }}


      # 5. Build Docker image
      - name: Build Server Docker Image
        run: |
          echo "Building server image..."

          docker build \
            -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.SERVER_IMAGE }}:${{ github.sha }} \
            ./server


      # 6. Push Docker image to ACR
      - name: Push Server Docker Image
        run: |
          echo "Pushing server image to ACR..."

          docker push \
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.SERVER_IMAGE }}:${{ github.sha }}


      # 7. Get AKS credentials
      - name: Get AKS Credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER }} \
            --overwrite-existing


      # 8. Verify Kubernetes manifest
      - name: Verify Kubernetes Manifest
        run: |
          echo "Checking Kubernetes files..."

          ls -la ./k8s/

          test -f ./k8s/server-deployment.yaml || \
          (echo "❌ server-deployment.yaml not found" && exit 1)

          echo "✅ Kubernetes manifest found"


      # 9. Replace Docker image
      - name: Update Server Image Tag
        run: |
          echo "Updating Docker image..."

          sed -i \
            "s|SERVER_IMAGE_TAG|${{ env.ACR_NAME }}.azurecr.io/${{ env.SERVER_IMAGE }}:${{ github.sha }}|g" \
            ./k8s/server-deployment.yaml

          echo "Updated image:"
          grep "image:" ./k8s/server-deployment.yaml


      # 10. Deploy to AKS
      - name: Deploy Server to AKS
        run: |
          echo "Deploying to AKS..."

          kubectl apply -f ./k8s/server-deployment.yaml

          echo "✅ Deployment applied successfully"


      # 11. Verify deployment
      - name: Verify Server Rollout
        run: |
          echo "Waiting for server deployment..."

          kubectl rollout status \
            deployment/server-deployment \
            --timeout=5m

          echo "✅ Server deployment successful"


      # 12. Show pods
      - name: Check Pods
        run: |
          kubectl get pods
          kubectl get services