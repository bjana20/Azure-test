name: Deploy Server

on:
  push:
    branches: [ main ]
    paths: [ 'server/**' ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: bhaskararitraacr
  RESOURCE_GROUP: rg-node-cicd
  AKS_CLUSTER: my-aks-cluster

jobs:
  deploy-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      - name: Build and push to ACR
        run: |
          az acr login --name ${{ env.ACR_NAME }}
          docker build -t ${{ env.ACR_NAME }}.azurecr.io/server:${{ github.sha }} ./server
          docker push ${{ env.ACR_NAME }}.azurecr.io/server:${{ github.sha }}
      
      - name: Deploy to AKS
        run: |
          az aks get-credentials -g ${{ env.RESOURCE_GROUP }} -n ${{ env.AKS_CLUSTER }}
          sed -i "s|SERVER_IMAGE_TAG|${{ env.ACR_NAME }}.azurecr.io/server:${{ github.sha }}|g" ./k8s/server-deployment.yaml
          kubectl apply -f ./k8s/server-deployment.yaml
          kubectl rollout status deployment/server-deployment --timeout=5m
      
      - name: Show service endpoint
        run: |
          kubectl get service server-service